# fly.toml app configuration file generated for techfalls on 2026-11-12T15:42:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'techfalls'
primary_region = 'iad'

[build]
[[mounts]]
  source = 'mldca_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
